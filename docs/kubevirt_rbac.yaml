apiVersion: v1
kind: Namespace
metadata:
  name: checkmk-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkmk-kubevirt
  namespace: checkmk-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: checkmk-kubevirt-view
rules:
- apiGroups: ["kubevirt.io"]
  resources:
  - virtualmachines
  - virtualmachineinstances
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: checkmk-kubevirt-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: checkmk-kubevirt-view
subjects:
- kind: ServiceAccount
  name: checkmk-kubevirt
  namespace: checkmk-monitoring
